# Target catalog (Requirement 2). Images are pinned by digest (research.md section 3).
# built:<name> images are thin-server images built by CDK into the account's ECR repo.
x-vllm-common: &vllm_common
  max_num_seqs: 256          # Intel's recipe value; the intel suite tests concurrency up to 256
  max_num_batched_tokens: 2048
  seed: 0

# CPU features the instances of a family actually expose (lscpu on the booted host). The custom
# Xeon 6 (6975P-C) behind m8i/c8i reports amx_bf16/amx_int8/amx_tile and avx512_fp16 but NOT
# amx_fp16: 36 of 36 host-facts records through 2026-11-15 (27 m8i.4xlarge, 3 m8i.8xlarge, 6 c8i.4xlarge,
# AL2023 kernel 6.12). r8i has not been booted here. So the FP16-on-AMX cells the design planned for
# T3/T4 cannot run. Do not add amx_fp16 back because Granite Rapids "has" it: the instance is what counts.
x-amx-8i: &amx_8i [amx_bf16, amx_int8, amx_tile]
# The plain-PyTorch CPU option (t4-m8i-4xl-torch, image thin-torch-cpu) was removed on 2026-11-20: on every
# workload it measured 3-10x below vLLM on the same instance (embedding 170 vs 585/s, DSPM 0.3 vs 3.9 docs/s),
# so it compared PyTorch's lack of batching with vLLM's, not CPU with GPU. PyTorch stays only as the GPU
# side's engine for Flan-T5, which vLLM does not serve.

targets:
  - id: t1-g6
    label: T1
    instance_type: g6.xlarge
    alternates: [g5.xlarge, g6.2xlarge]   # same single L4 as g6.xlarge; capacity fallback (1.16x the m8i.4xlarge price)
    ami_ssm: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-amazon-linux-2023/latest/ami-id
    accelerator: gpu
    root_volume_gib: 200
    engines:
      vllm:
        image: public.ecr.aws/deep-learning-containers/vllm@sha256:6db6c433557b38d86d47f68e367532d41a8341e56fa2605e60c13d190a5c7d17
        args: {<<: *vllm_common, gpu_memory_utilization: 0.90}
      thin-torch:
        image: built:thin-torch-cuda
        args: {max_batch: 16, max_wait_ms: 5}
      decider:
        image: built:decider-cuda
        args: {max_batch: 8, max_concurrency: 4}

  - id: t2-m8i-4xl
    label: T2
    instance_type: m8i.4xlarge
    ami_ssm: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.12-x86_64
    accelerator: cpu
    cpu_features: *amx_8i
    root_volume_gib: 200
    engines:
      vllm:
        image: docker.io/vllm/vllm-openai-cpu@sha256:4154467a886f8b7ffa9dbab32f873f5ca4528409d042a6ec866e8888223263d3
        env: {VLLM_CPU_OMP_THREADS_BIND: auto, VLLM_CPU_NUM_OF_RESERVED_CPU: "1"}
        args: {<<: *vllm_common, kv_cache_gib: 32, block_size: 128}
      decider:
        image: built:decider-cpu
        env: {OMP_PROC_BIND: close, OMP_PLACES: cores}
        args: {max_batch: 8, max_concurrency: 2, omp_threads: 8}

  - id: t2-c8i-4xl
    label: T2
    instance_type: c8i.4xlarge
    inherits: t2-m8i-4xl
    engines:
      vllm:
        image: docker.io/vllm/vllm-openai-cpu@sha256:4154467a886f8b7ffa9dbab32f873f5ca4528409d042a6ec866e8888223263d3
        args: {kv_cache_gib: 16}

  - id: t2-m8i-8xl
    label: T2-scale
    instance_type: m8i.8xlarge
    inherits: t2-m8i-4xl
    engines:
      vllm:
        image: docker.io/vllm/vllm-openai-cpu@sha256:4154467a886f8b7ffa9dbab32f873f5ca4528409d042a6ec866e8888223263d3
        args: {kv_cache_gib: 64}

  # Retired 2026-11-21 (owner decision), kept disabled so earlier runs still render. Measured at full grade on
  # RoBERTa (roberta-int8-full-20261120T211803Z): OpenVINO BF16 through the thin server ran 2.3x BELOW vLLM
  # BF16 on the same m8i.4xlarge, and the weight-only INT8 export was 18% slower than BF16-OV (an encoder is
  # compute-bound; decompressing weights costs more than the saved bandwidth). The chat path (OVMS) was never
  # measured at full grade. Either way it compared engines, not CPU with GPU: vLLM, Intel's own Xeon recipe,
  # is the CPU engine on every active option.
  - id: t3-m8i-4xl-ov
    label: T3
    instance_type: m8i.4xlarge
    ami_ssm: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.12-x86_64
    accelerator: cpu
    cpu_features: *amx_8i
    enabled: false
    engines:
      ovms:
        image: docker.io/openvino/model_server@sha256:148e3fe802261ed0b5b634de3bbccdefe7176a218ec34a88e382b40704c34a1c
        args: {max_num_seqs: 256, max_num_batched_tokens: 2048, cache_size_gb: 24}
      thin-openvino:
        image: built:thin-openvino
        args: {max_batch: 16, max_wait_ms: 5}

  # Retired 2026-11-20 (see the note at the top): kept, disabled, so the runs that measured it still render and
  # their rows keep their instance type; no new run can select it (resolve_cells refuses disabled targets) and
  # the Core stack builds no launch template or image for it.
  - id: t4-m8i-4xl-torch
    label: T4
    instance_type: m8i.4xlarge
    ami_ssm: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.12-x86_64
    accelerator: cpu
    cpu_features: *amx_8i
    enabled: false
    engines:
      thin-torch:
        image: built:thin-torch-cpu
        env: {OMP_NUM_THREADS: "8", OMP_PROC_BIND: close, OMP_PLACES: cores, ONEDNN_PRIMITIVE_CACHE_CAPACITY: "4096"}
        args: {max_batch: 16, max_wait_ms: 5}

  - id: t5-m7i-4xl
    label: T5
    instance_type: m7i.4xlarge
    inherits: t2-m8i-4xl
    cpu_features: [amx_bf16, amx_int8, amx_tile]
    enabled: false
