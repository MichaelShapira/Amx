# DSPM/DLP full run (design section 24.5).
run:
  name: dspm-full
  suite: dspm
  mode: full
  region: us-east-1
  az_id: use1-az1
  models: [m1-qwen3-1.7b, m6-gemma-4-e4b, m7-gemma-4-e2b, m3-roberta-large-mnli]
  cells:
    - {target: t1-g6, precision: bf16}
    - {target: t1-g6, precision: bf16, model: m1-qwen3-1.7b, variant: constrained}
    - {target: t2-m8i-4xl, precision: bf16, model: m1-qwen3-1.7b}
    - {target: t2-m8i-4xl, precision: bf16, model: m1-qwen3-1.7b, variant: constrained}
    - {target: t2-m8i-4xl, precision: bf16, model: m6-gemma-4-e4b}
    - {target: t2-m8i-4xl, precision: bf16, model: m7-gemma-4-e2b}
    - {target: t2-m8i-4xl, precision: bf16, model: m3-roberta-large-mnli}
  prompt_set: dspm
  sampling: {temperature: 0.0, max_new_tokens: 4, ignore_eos: false, seed: 0}
  concurrency: [1, 4, 8, 16, 32, 64]
  per_level: {requests: 200}
  repeats: 3
  warmup_requests: 20
  request_timeout_s: 300
  quality: {enabled: false}
  sla: {p99_e2e_ms: 1000, max_error_pct: 1.0}
  dspm:
    workloads: [W1, W2, W3, W4]
    sla_preset: bulk
    prefix_caching: true
  stop_targets_after_run: true
