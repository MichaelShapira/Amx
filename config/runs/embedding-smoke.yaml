# Embedding-suite smoke run: EmbeddingGemma 300M on T1 (GPU, vLLM pooling runner) vs T2 (m8i.4xlarge,
# vLLM CPU) and T4 (PyTorch), short messages in EN/DE/ES, batches of 1, 8 and 32. All prefill.
run:
  name: embedding-smoke-e1
  suite: embedding
  mode: smoke
  account: "346399954218"
  region: us-east-1
  az_id: use1-az1
  models: [e1-embeddinggemma-300m]
  cells:
    - {target: t1-g6, precision: bf16}
    - {target: t2-m8i-4xl, precision: bf16}
    - {target: t4-m8i-4xl-torch, precision: bf16}
  prompt_set: sentence                 # text size: sentence | paragraph
  embedding: {test_items: 300}
  concurrency: [1, 8, 32]
  batch_sizes: [1, 8, 32]
  per_level: {requests: 50}
  repeats: 1
  warmup_requests: 20
  request_timeout_s: 120
  quality: {enabled: false}
  sla: {p99_e2e_ms: 1000, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  purchase: {type: spot, spot_fallback_on_demand: true}
  instance_types: {t1-g6: g6.xlarge, t2-m8i-4xl: m8i.4xlarge, t4-m8i-4xl-torch: m8i.4xlarge}
  alternates: {t1-g6: [g5.xlarge, g6.2xlarge]}
  stop_targets_after_run: true
