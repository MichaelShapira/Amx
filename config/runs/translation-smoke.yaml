# Translation-suite smoke run: Gemma 4 E4B on T1 (GPU) vs T2 (m8i.4xlarge, vLLM CPU), short
# messages, all four directions. Below the methodology defaults, so every output is labeled "smoke".
# The answer ends where the model ends it (ignore_eos: false); the token limit per text size is the
# wizard's (config TEXT_SIZES): 192 for sentences, 448 for paragraphs.
run:
  name: translation-smoke-m6
  suite: translation
  mode: smoke
  region: us-east-1
  az_id: use1-az1
  models: [m6-gemma-4-e4b]
  cells:
    - {target: t1-g6, precision: bf16}
    - {target: t2-m8i-4xl, precision: bf16}
  prompt_set: sentence                 # text size: sentence | paragraph
  translation: {directions: [en-de, de-en, en-es, es-en], test_items: 100}
  sampling: {temperature: 0.0, max_new_tokens: 192, ignore_eos: false, seed: 0}
  concurrency: [1, 4, 16]
  per_level: {requests: 50}
  repeats: 1
  warmup_requests: 20
  request_timeout_s: 600
  quality: {enabled: false}            # translation quality comes from the per-direction accuracy pass
  sla: {p99_e2e_ms: 10000, p99_ttft_ms: 2000, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  purchase: {type: spot, spot_fallback_on_demand: true}
  instance_types: {t1-g6: g6.xlarge, t2-m8i-4xl: m8i.4xlarge}
  alternates: {t1-g6: [g5.xlarge, g6.2xlarge]}
  stop_targets_after_run: true
