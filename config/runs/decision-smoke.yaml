# Decision-suite smoke run: Strands Decider E4B on T1 (GPU, bf16) vs T2 (m8i.4xlarge, fp32 on CPU as the project
# serves it), short customer messages, 1 or 3 typed questions per request. The accuracy pass asks all three questions
# on 300 items and scores them against the gold labels and against the GPU's answers.
run:
  name: decision-smoke-d1
  suite: decision
  mode: smoke
  region: us-east-1
  az_id: use1-az1
  models: [d1-strands-decider-e4b]
  cells:
    - {target: t1-g6, precision: bf16}
    - {target: t2-m8i-4xl, precision: bf16}
  prompt_set: short                  # state size: short (a message) | long (a ticket thread)
  decision: {questions: [1, 3], test_items: 300}
  concurrency: [1, 4, 16]
  per_level: {requests: 50}
  repeats: 1
  warmup_requests: 20
  request_timeout_s: 300
  quality: {enabled: false}
  sla: {p99_e2e_ms: 2000, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  purchase: {type: spot, spot_fallback_on_demand: true}
  instance_types: {t1-g6: g6.xlarge, t2-m8i-4xl: m8i.4xlarge}
  alternates: {t1-g6: [g5.xlarge, g6.2xlarge]}
  stop_targets_after_run: true
