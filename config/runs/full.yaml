# Standard-suite full run: methodology defaults (200 requests x 3 repeats per level).
run:
  name: full-standard
  suite: standard
  mode: full
  account: "346399954218"
  region: us-east-1
  az_id: use1-az1
  models: [m1-qwen3-1.7b, m6-gemma-4-e4b, m7-gemma-4-e2b, m3-roberta-large-mnli, m5-flan-t5-xl]
  cells:
    # GPU baselines
    - {target: t1-g6, precision: bf16}
    # vLLM CPU, BF16 on three sizes (chat models) and the classifier
    - {target: t2-m8i-4xl, precision: bf16, model: m1-qwen3-1.7b}
    - {target: t2-m8i-4xl, precision: bf16, model: m6-gemma-4-e4b}
    - {target: t2-m8i-4xl, precision: bf16, model: m7-gemma-4-e2b}
    - {target: t2-m8i-4xl, precision: bf16, model: m3-roberta-large-mnli}
    - {target: t2-c8i-4xl, precision: bf16, model: m1-qwen3-1.7b}
    - {target: t2-m8i-8xl, precision: bf16, model: m1-qwen3-1.7b}
    - {target: t2-m8i-8xl, precision: bf16, model: m6-gemma-4-e4b}
    # OpenVINO
    - {target: t3-m8i-4xl-ov, precision: bf16-ov, model: m1-qwen3-1.7b}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m1-qwen3-1.7b}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m1-qwen3-1.7b}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m5-flan-t5-xl}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m5-flan-t5-xl}
    # FP16 on the CPU targets is gone: the EC2 hosts do not expose amx_fp16 (config/targets.yaml).
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m3-roberta-large-mnli}
    # Native PyTorch
    - {target: t4-m8i-4xl-torch, precision: bf16, model: m3-roberta-large-mnli}
    - {target: t4-m8i-4xl-torch, precision: bf16, model: m5-flan-t5-xl}
    - {target: t4-m8i-4xl-torch, precision: fp32, model: m3-roberta-large-mnli}
  prompt_set: medium
  sampling: {temperature: 0.0, max_new_tokens: 256, ignore_eos: true, seed: 0}
  concurrency: [1, 4, 8, 16, 32, 64]
  per_level: {requests: 200}
  repeats: 3
  warmup_requests: 20
  request_timeout_s: 600
  quality: {enabled: true, prompt_set: quality-50, max_new_tokens: 256}
  sla: {p99_ttft_ms: 2000, p50_tpot_ms: 150, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  stop_targets_after_run: true
