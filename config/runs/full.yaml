# Standard-suite full run: methodology defaults (200 requests x 3 repeats per level).
run:
  name: full-standard
  suite: standard
  mode: full
  account: "346399954218"
  region: us-east-1
  az_id: use1-az1
  models: [m1-qwen2.5-3b, m2-qwen3-4b-2507, m3-roberta-large-mnli, m4-gemma-2-2b, m5-flan-t5-xl]
  cells:
    # GPU baselines
    - {target: t1-g6, precision: bf16}
    # vLLM CPU, BF16 on three sizes, INT8 W8A8 on m8i.4xlarge (decoders only)
    - {target: t2-m8i-4xl, precision: bf16, model: m1-qwen2.5-3b}
    - {target: t2-m8i-4xl, precision: bf16, model: m2-qwen3-4b-2507}
    - {target: t2-m8i-4xl, precision: bf16, model: m3-roberta-large-mnli}
    - {target: t2-m8i-4xl, precision: bf16, model: m4-gemma-2-2b}
    - {target: t2-m8i-4xl, precision: w8a8, model: m1-qwen2.5-3b}
    - {target: t2-m8i-4xl, precision: w8a8, model: m2-qwen3-4b-2507}
    - {target: t2-m8i-4xl, precision: w8a8, model: m4-gemma-2-2b}
    - {target: t2-c8i-4xl, precision: bf16, model: m1-qwen2.5-3b}
    - {target: t2-c8i-4xl, precision: bf16, model: m2-qwen3-4b-2507}
    - {target: t2-m8i-8xl, precision: bf16, model: m1-qwen2.5-3b}
    - {target: t2-m8i-8xl, precision: bf16, model: m2-qwen3-4b-2507}
    # OpenVINO
    - {target: t3-m8i-4xl-ov, precision: bf16-ov, model: m1-qwen2.5-3b}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m1-qwen2.5-3b}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m1-qwen2.5-3b}
    - {target: t3-m8i-4xl-ov, precision: bf16-ov, model: m2-qwen3-4b-2507}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m2-qwen3-4b-2507}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m2-qwen3-4b-2507}
    - {target: t3-m8i-4xl-ov, precision: bf16-ov, model: m4-gemma-2-2b}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m4-gemma-2-2b}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m4-gemma-2-2b}
    - {target: t3-m8i-4xl-ov, precision: bf16-ov, model: m5-flan-t5-xl}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m5-flan-t5-xl}
    - {target: t3-m8i-4xl-ov, precision: int4-ov, model: m5-flan-t5-xl}
    - {target: t3-m8i-4xl-ov, precision: fp16, model: m3-roberta-large-mnli}
    - {target: t3-m8i-4xl-ov, precision: int8-ov, model: m3-roberta-large-mnli}
    # Native PyTorch
    - {target: t4-m8i-4xl-torch, precision: bf16, model: m3-roberta-large-mnli}
    - {target: t4-m8i-4xl-torch, precision: fp16, model: m3-roberta-large-mnli}
    - {target: t4-m8i-4xl-torch, precision: fp32, model: m3-roberta-large-mnli}
    - {target: t4-m8i-4xl-torch, precision: bf16, model: m5-flan-t5-xl}
  prompt_set: medium
  sampling: {temperature: 0.0, max_new_tokens: 256, ignore_eos: true, seed: 0}
  concurrency: [1, 4, 8, 16, 32, 64]
  per_level: {requests: 200}
  repeats: 3
  warmup_requests: 20
  request_timeout_s: 600
  quality: {enabled: true, prompt_set: quality-50, max_new_tokens: 256}
  sla: {p99_ttft_ms: 2000, p50_tpot_ms: 150, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  stop_targets_after_run: true
