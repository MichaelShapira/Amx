# Smoke: the Strands Decider 12B on both sides. The GPU side needs an L40S (g6e.xlarge, 45 GiB) for the 24 GB of
# bf16 weights; the CPU side holds the fp32 torso (~45 GiB) on an m8i.8xlarge (128 GiB). $1.86/h vs $1.69/h: a fair
# pair. Same shape as decision-smoke.yaml otherwise.
run:
  name: decision-smoke-d2
  suite: decision
  mode: smoke
  account: "346399954218"
  region: us-east-1
  az_id: use1-az1
  models: [d2-strands-decider-12b]
  cells:
    - {target: t1-g6, precision: bf16}
    - {target: t2-m8i-8xl, precision: bf16}
  prompt_set: short
  decision: {questions: [1, 3], test_items: 300}
  concurrency: [1, 4, 16]
  per_level: {requests: 50}
  repeats: 1
  warmup_requests: 20
  request_timeout_s: 300
  quality: {enabled: false}
  sla: {p99_e2e_ms: 2000, max_error_pct: 1.0}
  capacity: {max_cpu_instances_per_gpu: 4}
  purchase: {type: spot, spot_fallback_on_demand: true}
  instance_types: {t1-g6: g6e.xlarge, t2-m8i-8xl: m8i.8xlarge}
  alternates: {t1-g6: [g6e.2xlarge]}
  stop_targets_after_run: true
