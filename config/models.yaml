# Model catalog (Requirement 1). Revisions are the Hugging Face commits pinned on
# 2026-11-09 (research.md section 2). Nominal size is capped at 4B (Requirement 1.6).
size_cap_b: 4.0

# bf16-ov: the uncompressed OpenVINO cell. optimum-cli has no bf16 weight format, so the IR is
# written in FP16 and OpenVINO's CPU plugin runs it in BF16 on AMX (its default inference precision
# where AMX-BF16 exists); the AMX probe records the precision it actually chose and bench/amx.py
# flags a cell that did not run BF16. The like-for-like baseline on the OpenVINO option.
x-ov-bf16: &ov_bf16 {weight_format: fp16}
x-ov-int8: &ov_int8 {weight_format: int8}
x-ov-int4: &ov_int4 {weight_format: int4, group_size: 128, ratio: 1.0, sym: false}

models:
  - id: m1-qwen2.5-3b
    slot: M1
    hf_repo: Qwen/Qwen2.5-3B-Instruct
    revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
    type: decoder
    license: qwen-research          # non-commercial: research or evaluation only
    params: 3085938688
    nominal_size_b: 3
    suites: [standard, dspm]
    max_input_tokens: 4096
    max_model_len: 16384
    prompt_format: {kind: chat_template}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [vllm, thin-torch], weights: bf16, activations: bf16}
      w8a8:
        engines: [vllm]
        hf_repo: RedHatAI/Qwen2.5-3B-Instruct-quantized.w8a8
        revision: cd4a8836f6c1e916f43d7c60c4dc3796b7aca18c
        weights: int8
        activations: int8
      bf16-ov: {engines: [ovms], export: *ov_bf16, weights: bf16, activations: bf16}
      int8-ov: {engines: [ovms], export: *ov_int8, weights: int8, activations: bf16-or-int8-dynamic}
      int4-ov: {engines: [ovms], export: *ov_int4, weights: int4-g128, activations: bf16-or-int8-dynamic}
      awq-int4:
        engines: [vllm]
        hf_repo: Qwen/Qwen2.5-3B-Instruct-AWQ
        revision: 3559b226e8ce77211e2c1bd7ddfb7686fec4d6dd
        weights: int4-awq
        activations: bf16
        enabled: false

