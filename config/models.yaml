    suites: [standard, dspm]
    max_input_tokens: 512
    prompt_format: {kind: pair}
    classifier: {batch_sizes: [1, 8, 32, 64], labels: [CONTRADICTION, NEUTRAL, ENTAILMENT], max_length: 512}
    quality_reference:
      target: t1-g6
      precision: bf16
      fp32_anchor: {target: t4-m8i-4xl-torch, precision: fp32}
    precisions:
      bf16: {engines: [vllm, thin-torch, thin-openvino], inference_precision: bf16, weights: bf16, activations: bf16}
      fp16:
        engines: [thin-torch, thin-openvino]
        inference_precision: f16
        weights: fp16
        activations: fp16
