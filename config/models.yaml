    prompt_format: {kind: plain}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [thin-torch], weights: bf16, activations: bf16}
      # Measured and disabled 2026-11-14 (run flan-bf16-ov-vs-torch-20261114T183728Z, m8i.4xlarge,
      # smoke): OpenVINO BF16 through optimum-intel's generate loop lost to PyTorch eager BF16 on
      # every metric — C=1 E2E 7.4 s vs 6.4 s, 17 vs 20 tok/s; C=4 59 vs 68 agg tok/s, $4.01 vs
      # $3.46 per 1M tokens — and as BF16 it can only tie on quality. Both cells were AMX VERIFIED
      # (OpenVINO chose bf16, 96/96 GEMMs on amx_bf16), so it was a fair comparison. Flip `enabled`
      # to re-measure; the thin-openvino wrapper is not a serving engine, so expect the same.
      bf16-ov:
        engines: [thin-openvino]
        export: {weight_format: fp16, task: text2text-generation-with-past}
        weights: bf16
        activations: bf16
        enabled: false
      int8-ov:
        engines: [thin-openvino]
        export: {weight_format: int8, task: text2text-generation-with-past}
        weights: int8
        activations: bf16-or-int8-dynamic
      int4-ov:
        engines: [thin-openvino]
        export: {weight_format: int4, group_size: 128, ratio: 1.0, sym: false, task: text2text-generation-with-past}
        weights: int4-g128
        activations: bf16-or-int8-dynamic

  # Gemma 4 E4B Instruct (2026-11-19), from the Intel Software Catalog entry
  # https://swcatalog.intel.com/models/google-gemma-4-e4b-it (validated on Xeon with vLLM's CPU
  # backend) and the vLLM recipe https://recipes.vllm.ai/Google/gemma-4-E4B-it?hardware=xeon6.
  # Multimodal (text, image, audio) upstream; served text-only here. vllm_args are the recipe's
  # serve flags: the tool-call template and the gemma4 tool-call and reasoning parsers configure
  # the chat endpoint (the benchmark measures /v1/completions with the client-rendered chat
  # template, so they do not change the measured path); the modality limits skip the image and
  # audio profiling at start, which is what frees the GPU memory an 8B checkpoint needs on an L4.
  # Thinking stays off: the chat template adds <|think|> only when enable_thinking is set.
  # No INT8 checkpoint exists for vLLM (RedHatAI publishes an FP8 one, GPU-only); OpenVINO/gemma-4-
  # E4B-it-int8-ov is a ready IR, but this harness exports IRs itself, so no OpenVINO cell yet.
  - id: m6-gemma-4-e4b
    slot: M6
    hf_repo: google/gemma-4-E4B-it
    revision: 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c
    type: decoder
    license: apache-2.0
    params: 7996156490
    nominal_size_b: 8.0
    suites: [standard, dspm, translation]
    max_input_tokens: 4096
    max_model_len: 16384
    prompt_format: {kind: chat_template}
    quality_reference: {target: t1-g6, precision: bf16}
    vllm_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --chat-template
      - examples/tool_chat_template_gemma4.jinja
      - --reasoning-parser
      - gemma4
      - --limit-mm-per-prompt
      - '{"image": 0, "audio": 0}'
    notes: >-
      Google's Gemma 4 E4B: 8.0 billion stored parameters (4.5 billion effective), text, image and
      audio upstream, text only here. Apache-2.0. Served with the vLLM flags Intel's Xeon recipe
      lists; PyTorch through the thin server loads the same checkpoint. Not yet measured live.
    precisions:
      bf16: {engines: [vllm, thin-torch], weights: bf16, activations: bf16}

