# Model catalog (Requirement 1). Revisions are Hugging Face commits pinned on the date each entry was
# added. Reset on 2026-11-19 to the models the comparison is about: the Gemma 4 instruct models and the
# Qwen model Intel's Software Catalog publishes Xeon benchmarks for (chat / generation), Flan-T5 XL
# (encoder-decoder), RoBERTa-large (classifier) and EmbeddingGemma (embeddings). The size cap is 8B:
# Gemma 4 E4B stores 8.0B parameters (Google counts 4.5B "effective", the per-layer embedding tables
# excluded) and every engine here loads all of them.
size_cap_b: 8.0

# bf16-ov: the uncompressed OpenVINO cell. optimum-cli has no bf16 weight format, so the IR is
# written in FP16 and OpenVINO's CPU plugin runs it in BF16 on AMX (its default inference precision
# where AMX-BF16 exists); the AMX probe records the precision it actually chose and bench/amx.py
# flags a cell that did not run BF16. The like-for-like baseline on the OpenVINO option.
x-ov-bf16: &ov_bf16 {weight_format: fp16}
x-ov-int8: &ov_int8 {weight_format: int8}
x-ov-int4: &ov_int4 {weight_format: int4, group_size: 128, ratio: 1.0, sym: false}

models:
  # Qwen3-1.7B: the model Intel's catalog describes as "designed for extreme throughput on server
  # CPUs" and publishes 128/128 benchmarks for (https://swcatalog.intel.com/models/qwen-qwen3-1-7b).
  # Its chat template thinks by default; the recipe turns that off (--default-chat-template-kwargs
  # enable_thinking=false), and so does this catalog, client-side, for every engine alike.
  - id: m1-qwen3-1.7b
    slot: M1
    hf_repo: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    type: decoder
    license: apache-2.0
    params: 2031739904
    nominal_size_b: 1.7
    suites: [standard, dspm, translation, intel]
    max_input_tokens: 4096
    max_model_len: 16384
    prompt_format: {kind: chat_template, template_kwargs: {enable_thinking: false}}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [vllm], weights: bf16, activations: bf16}
      # OpenVINO formats (bf16-ov, int8-ov, int4-ov) retired 2026-11-21 with the T3 option; see config/targets.yaml.

  - id: m3-roberta-large-mnli
    slot: M3
    hf_repo: FacebookAI/roberta-large-mnli
    revision: 2a8f12d27941090092df78e4ba6f0928eb5eac98
    type: encoder-classifier
    license: mit
    params: 356412419
    nominal_size_b: 0.36
    suites: [standard, dspm]
    max_input_tokens: 512
    prompt_format: {kind: pair}
    classifier: {batch_sizes: [1, 8, 32, 64], labels: [CONTRADICTION, NEUTRAL, ENTAILMENT], max_length: 512}
    quality_reference:
      target: t1-g6
      precision: bf16
    precisions:
      bf16: {engines: [vllm], inference_precision: bf16, weights: bf16, activations: bf16}
      fp16:
        engines: [vllm]                      # the GPU (--dtype float16); no AWS Intel host has AMX-FP16
        inference_precision: f16
        weights: fp16
        activations: fp16
        requires_cpu_flag: amx_fp16
      # int8-ov retired 2026-11-21: weight-only INT8 through OpenVINO was 18% slower than BF16 on this encoder.

  # Retired 2026-11-21 with the OpenVINO option: its CPU engines were PyTorch (retired 2026-11-20) and OpenVINO,
  # so it has no CPU side left; kept disabled so earlier runs still render.
  - id: m5-flan-t5-xl
    slot: M5
    hf_repo: google/flan-t5-xl
    revision: 7d6315df2c2fb742f0f5b556879d730926ca9001
    type: encoder-decoder
    license: apache-2.0
    enabled: false
    params: 2849757184
    nominal_size_b: 2.85
    suites: [standard, dspm, translation]
    max_input_tokens: 1024             # the 4K prompt set is skipped; DSPM inputs stay <= 512
    prompt_format: {kind: plain}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [thin-torch], weights: bf16, activations: bf16}
      # Measured and disabled 2026-11-14 (run flan-bf16-ov-vs-torch-20261114T183728Z, m8i.4xlarge,
      # smoke): OpenVINO BF16 through optimum-intel's generate loop lost to PyTorch eager BF16 on
      # every metric. Both cells were AMX VERIFIED, so it was a fair comparison. Flip `enabled` to
      # re-measure; the thin-openvino wrapper is not a serving engine, so expect the same.
      bf16-ov:
        engines: [thin-openvino]
        export: {weight_format: fp16, task: text2text-generation-with-past}
        weights: bf16
        activations: bf16
        enabled: false
      int8-ov:
        engines: [thin-openvino]
        export: {weight_format: int8, task: text2text-generation-with-past}
        weights: int8
        activations: bf16-or-int8-dynamic
      int4-ov:
        engines: [thin-openvino]
        export: {weight_format: int4, group_size: 128, ratio: 1.0, sym: false, task: text2text-generation-with-past}
        weights: int4-g128
        activations: bf16-or-int8-dynamic

  # Gemma 4 E4B Instruct (2026-11-19), from the Intel Software Catalog entry
  # https://swcatalog.intel.com/models/google-gemma-4-e4b-it (validated on Xeon with vLLM's CPU
  # backend) and the vLLM recipe https://recipes.vllm.ai/Google/gemma-4-E4B-it?hardware=xeon6.
  # Multimodal (text, image, audio) upstream; served text-only here. vllm_args are the recipe's
  # serve flags: the gemma4 tool-call and reasoning parsers configure the chat endpoint (the
  # benchmark measures /v1/completions with the client-rendered chat template, so they do not
  # change the measured path); the modality limits skip the image and audio profiling at start,
  # which is what frees the GPU memory an 8B checkpoint needs on an L4. The recipe's
  # `--chat-template examples/tool_chat_template_gemma4.jinja` is NOT passed: that file ships in
  # the vLLM CPU image's working directory but not in the AWS DLC GPU image (run
  # translation-smoke-m6-20261119T081428Z: "appears path-like, but doesn't exist"), and the model's
  # own chat_template.jinja already carries the tool-call format, so the server-side template adds
  # nothing here. Thinking stays off: the template adds <|think|> only when enable_thinking is set.
  # No INT8 checkpoint exists for vLLM (RedHatAI publishes an FP8 one, GPU-only); OpenVINO/gemma-4-
  # E4B-it-int8-ov is a ready IR, but this harness exports IRs itself, so no OpenVINO cell yet.
  # Live: vLLM CPU and GPU serve it (translation-smoke-m6-20261119T093236Z; 25 GiB KV on 64 GiB).
  - id: m6-gemma-4-e4b
    slot: M6
    hf_repo: google/gemma-4-E4B-it
    revision: 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c
    type: decoder
    license: apache-2.0
    params: 7996156490
    nominal_size_b: 8.0
    suites: [standard, dspm, translation, intel]
    max_input_tokens: 4096
    max_model_len: 16384
    prompt_format: {kind: chat_template}
    quality_reference: {target: t1-g6, precision: bf16}
    vllm_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --limit-mm-per-prompt
      - '{"image": 0, "audio": 0}'
    notes: >-
      Google's Gemma 4 E4B: 8.0 billion stored parameters (4.5 billion effective), text, image and
      audio upstream, text only here. Apache-2.0. Served with the vLLM flags Intel's Xeon recipe
      lists; PyTorch through the thin server loads the same checkpoint.
    precisions:
      bf16: {engines: [vllm], weights: bf16, activations: bf16}

  # Gemma 4 E2B Instruct: the compact member of the family (5.1B stored, 2B effective), from
  # https://swcatalog.intel.com/models/google-gemma-4-e2b-it. Same serving flags as E4B.
  - id: m7-gemma-4-e2b
    slot: M7
    hf_repo: google/gemma-4-E2B-it
    revision: 4adf15748de9e1a0097b6274cee9c15836c41c37
    type: decoder
    license: apache-2.0
    params: 5123178051
    nominal_size_b: 5.1
    suites: [standard, dspm, translation, intel]
    max_input_tokens: 4096
    max_model_len: 16384
    prompt_format: {kind: chat_template}
    quality_reference: {target: t1-g6, precision: bf16}
    vllm_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --limit-mm-per-prompt
      - '{"image": 0, "audio": 0}'
    notes: >-
      Google's Gemma 4 E2B: 5.1 billion stored parameters (2 billion effective), text, image and
      audio upstream, text only here. Apache-2.0. Same vLLM flags as E4B.
    precisions:
      bf16: {engines: [vllm], weights: bf16, activations: bf16}

  # EmbeddingGemma 300M: the embedding model Intel's catalog lists
  # (https://swcatalog.intel.com/models/redhatai-embeddinggemma-300m; RedHatAI's ungated mirror of
  # google/embeddinggemma-300m, Gemma-3-based, 768-dimensional, mean pooling + two Dense projections +
  # normalize in the sentence-transformers layout). Embeddings are all prefill: the whole input is
  # read once and no token is generated, which is the work AMX is for. The document prompt from the
  # model card is prepended to every input on every engine.
  - id: e1-embeddinggemma-300m
    slot: E1
    hf_repo: RedHatAI/embeddinggemma-300m
    revision: b1c4fbe856fc577b2d7acd9f3ed349a7315fdcfd
    type: embedding
    license: gemma
    params: 302863104
    nominal_size_b: 0.3
    suites: [embedding]
    max_input_tokens: 2048
    prompt_format: {kind: plain}
    embedding: {batch_sizes: [1, 8, 32, 64], max_length: 512, dim: 768, prefix: "title: none | text: "}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [vllm], weights: bf16, activations: bf16}
