    max_input_tokens: 4096
    max_model_len: 8192
    prompt_format: {kind: chat_template}   # Gemma 2 has no system role; policy goes into the user turn
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [vllm, thin-torch], weights: bf16, activations: bf16}
      w8a8:
        engines: [vllm]
        hf_repo: RedHatAI/gemma-2-2b-it-quantized.w8a8
        revision: 9bafbb745168370d51b0e7e2c9356d6bc2fd1a5d
        weights: int8
        activations: int8
      bf16-ov: {engines: [ovms], export: *ov_bf16, weights: bf16, activations: bf16}
      int8-ov: {engines: [ovms], export: *ov_int8, weights: int8, activations: bf16-or-int8-dynamic}
      int4-ov: {engines: [ovms], export: *ov_int4, weights: int4-g128, activations: bf16-or-int8-dynamic}

  - id: m5-flan-t5-xl
    slot: M5
    hf_repo: google/flan-t5-xl
    revision: 7d6315df2c2fb742f0f5b556879d730926ca9001
    type: encoder-decoder
    license: apache-2.0
    params: 2849757184
    nominal_size_b: 2.85
    suites: [standard, dspm]
    max_input_tokens: 1024             # the 4K prompt set is skipped; DSPM inputs stay <= 512
    prompt_format: {kind: plain}
    quality_reference: {target: t1-g6, precision: bf16}
    precisions:
      bf16: {engines: [thin-torch], weights: bf16, activations: bf16}
      # The full-quality OpenVINO cell: PyTorch eager is otherwise the only BF16 CPU path for T5
      # (vLLM has no T5), so this is the like-for-like CPU number against the GPU's BF16.
      bf16-ov:
        engines: [thin-openvino]
        export: {weight_format: fp16, task: text2text-generation-with-past}
        weights: bf16
        activations: bf16
      int8-ov:
        engines: [thin-openvino]
        export: {weight_format: int8, task: text2text-generation-with-past}
        weights: int8
        activations: bf16-or-int8-dynamic
      int4-ov:
        engines: [thin-openvino]
        export: {weight_format: int4, group_size: 128, ratio: 1.0, sym: false, task: text2text-generation-with-past}
        weights: int4-g128
        activations: bf16-or-int8-dynamic

