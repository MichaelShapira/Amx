[project]
name = "amx-gpu-bench"
version = "0.1.0"
description = "CPU (Intel AMX) vs GPU inference benchmark harness: same model, same load, same serving software on both sides"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Michael Shapira" }]
requires-python = ">=3.12"
# An application, not a library: every dependency is pinned to the version uv.lock resolves (uv sync installs the
# hash-locked tree exactly). Bump a pin and re-run `uv lock` together.
dependencies = [
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "numpy==2.5.5",
  "httpx==0.28.1",
  "boto3==1.44.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.5",
  "faker==39.1.0",          # the DSPM dataset hash depends on the exact Faker version
  "moto==5.2.5",
  "shellcheck-py==0.11.0.1",
  "pandas==3.1.1",
  "rouge-score==0.1.2",
  "matplotlib==3.11.2",
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "aws-cdk-lib==2.275.0",
  "constructs==10.8.1",
  "transformers==5.23.0",
  "huggingface_hub==2.4.0",
  "pyarrow==26.0.1",
  "openai==3.51.0",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "cdk.out", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tools/dspm/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
