[project]
name = "amx-gpu-bench"
version = "0.1.0"
description = "CPU (Intel AMX) vs GPU inference benchmark harness, DSPM/DLP suite and migration effort calculator"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6",
  "numpy>=2.1,<3",
  "httpx>=0.28,<1",
  "boto3>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "faker==39.1.0",          # the DSPM dataset hash depends on the exact Faker version
  "moto>=5.2,<6",
  "shellcheck-py>=0.10",
  "pandas>=2.2",
  "rouge-score==0.1.2",
  "matplotlib>=3.9",
  "streamlit>=1.45",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "aws-cdk-lib==2.275.0",
  "constructs>=10.4,<11",
  "transformers>=5.5,<6",
  "huggingface_hub>=0.30",
  "pyarrow>=18",
  "openai>=1.60",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "cdk.out", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tools/dspm/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
