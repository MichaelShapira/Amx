# Secret scanning (gitleaks, run by ProtoShield). The one allowlisted path generates the synthetic sensitive values of
# the DSPM dataset (fake API keys, card numbers, PEM blocks) on purpose: that dataset exists to test detectors, and
# every value is random at build time. Nothing real is in the repository; real tokens live in Secrets Manager.
[extend]
useDefault = true

[allowlist]
description = "synthetic DSPM test-data generators"
paths = [
  '''tools/dspm/fakes\.py$''',
  # PASSWORD="" is initialised empty and filled from stdin or a hidden prompt; the file never holds a value
  # (generic-api-key matched the empty initialisation in the history, where an inline allow cannot reach).
  '''infra/deploy_webapp\.sh$''',
]
# gitleaks runs over the git history, where an inline `gitleaks:allow` added later cannot reach the old commits:
# an empty shell variable initialisation and a benchmark level key, both matched by generic-api-key.
regexes = [
  '''PASSWORD="" FROM_STDIN=0''',
  '''m1__t2__bf16__W3-accuracy__c4''',
]
